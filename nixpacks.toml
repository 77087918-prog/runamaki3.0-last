[variables]
NIXPACKS_PHP_COMPOSER_INSTALL_COMMAND = 'composer install --no-dev --optimize-autoloader --no-scripts'

[phases.setup]
nixPkgs = ['php82', 'nginx', 'libmysqlclient', 'composer', 'nodejs_18', 'npm']

[phases.install]
cmds = ['mkdir -p /var/log/nginx', 'mkdir -p /var/cache/nginx', 'mkdir -p bootstrap/cache']

[phases.build]
cmds = [
  'composer install --no-dev --optimize-autoloader --no-scripts',
  'npm install', 
  'npm run build',
  'php artisan package:discover --ansi'
]

[phases.start]
cmd = 'sleep 10 && php artisan config:clear && php artisan cache:clear && php artisan migrate --force && php artisan config:cache && php artisan storage:link && php artisan serve --host=0.0.0.0 --port=$PORT'