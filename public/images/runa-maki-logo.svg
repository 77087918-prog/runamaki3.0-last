<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo de fondo -->
  <circle cx="200" cy="200" r="190" fill="url(#bg)" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- Montañas (estilo Andino) -->
  <g transform="translate(200,130)">
    <!-- Montaña principal -->
    <path d="M -60,50 L -30,0 L 0,20 L 30,0 L 60,50 Z" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>
    <!-- Montaña izquierda -->
    <path d="M -80,60 L -60,20 L -40,40 Z" fill="#34495e"/>
    <!-- Montaña derecha -->
    <path d="M 40,40 L 60,20 L 80,60 Z" fill="#34495e"/>
    <!-- Nieve en los picos -->
    <path d="M -35,10 L -30,0 L -25,10 Z" fill="white"/>
    <path d="M 25,10 L 30,0 L 35,10 Z" fill="white"/>
  </g>
  
  <!-- Sol/Luna Inca -->
  <circle cx="200" cy="80" r="15" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <g transform="translate(200,80)">
    <!-- Rayos del sol -->
    <line x1="0" y1="-25" x2="0" y2="-30" stroke="#f39c12" stroke-width="2"/>
    <line x1="18" y1="-18" x2="21" y2="-21" stroke="#f39c12" stroke-width="2"/>
    <line x1="25" y1="0" x2="30" y2="0" stroke="#f39c12" stroke-width="2"/>
    <line x1="18" y1="18" x2="21" y2="21" stroke="#f39c12" stroke-width="2"/>
    <line x1="0" y1="25" x2="0" y2="30" stroke="#f39c12" stroke-width="2"/>
    <line x1="-18" y1="18" x2="-21" y2="21" stroke="#f39c12" stroke-width="2"/>
    <line x1="-25" y1="0" x2="-30" y2="0" stroke="#f39c12" stroke-width="2"/>
    <line x1="-18" y1="-18" x2="-21" y2="-21" stroke="#f39c12" stroke-width="2"/>
  </g>
  
  <!-- Manos (reciprocidad) -->
  <g transform="translate(200,240)">
    <!-- Mano izquierda -->
    <path d="M -40,-10 C -50,-15 -60,-10 -65,0 C -60,10 -50,15 -40,10 L -30,5 L -25,0 L -30,-5 Z" 
          fill="#e67e22" stroke="#d35400" stroke-width="2"/>
    <!-- Mano derecha -->
    <path d="M 40,-10 C 50,-15 60,-10 65,0 C 60,10 50,15 40,10 L 30,5 L 25,0 L 30,-5 Z" 
          fill="#e67e22" stroke="#d35400" stroke-width="2"/>
    <!-- Objeto intercambiado (centro) -->
    <circle cx="0" cy="0" r="8" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  </g>
  
  <!-- Texto principal -->
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="36" font-weight="bold" 
        text-anchor="middle" fill="#2c3e50">RUNA MAKI</text>
  
  <!-- Subtítulo -->
  <text x="200" y="350" font-family="Arial, sans-serif" font-size="16" 
        text-anchor="middle" fill="#7f8c8d">Tecnología y Reciprocidad</text>
        
  <!-- Elementos decorativos andinos -->
  <g stroke="#e67e22" stroke-width="2" fill="none">
    <!-- Líneas decorativas -->
    <path d="M 80,300 L 120,300 L 125,295 L 130,300 L 170,300"/>
    <path d="M 230,300 L 270,300 L 275,295 L 280,300 L 320,300"/>
  </g>
</svg>